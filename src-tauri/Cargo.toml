[package]
name = "supercut"
version = "0.1.1"
description = "Magic Cut: turn a raw recording into a clean, cut video"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# Auto-updates from the release manifest on the user's Cloudflare R2 (updates/).
tauri-plugin-updater = "2"
# First-run model download (blocking; runs on a worker thread).
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parakeet TDT v3 through ONNX Runtime, in-process. No Python, no venv.
parakeet-rs = "0.4.4"
# Audio swap: lining up two recordings (already in the tree through parakeet-rs).
rustfft = "6"

# Audio features and decoding are slow unoptimized; keep dev/test builds usable.
[profile.dev.package."*"]
opt-level = 3
