<!doctype html>
<html>
<body style="margin:0;background:#000">
<div style="position:relative;width:640px;height:360px">
  <video id="a" src="/media/a.mp4" style="position:absolute;width:640px;height:360px" playsinline></video>
  <video id="b" src="/media/a.mp4" style="position:absolute;width:640px;height:360px;opacity:0" playsinline></video>
</div>
<script type="module">
  // How precisely can a hidden twin, playing at 1e-4, be put in step with the one you see, and does it disturb it?
  // mode 'seek': seek it while it plays; 'pauseplay': pause, seek exactly, play. Offset = twin − (seen + gap), steady.
  const [a, b] = ['a', 'b'].map((id) => document.getElementById(id));
  const until = (el, k) => new Promise((r) => el.addEventListener(k, r, { once: true }));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let frames = [];
  const cb = (now) => { frames.push(now); a.requestVideoFrameCallback(cb); };
  window.probe = async ({ mode, gap, lead, trials }) => {
    for (const el of [a, b]) if (el.readyState < 2) await until(el, 'loadeddata');
    a.volume = 1; a.currentTime = 0.5; await until(a, 'seeked'); await a.play();
    b.volume = 1e-4; b.currentTime = 0.5 + gap; await until(b, 'seeked'); await b.play();
    a.requestVideoFrameCallback(cb);
    const out = [];
    for (let k = 0; k < trials; k++) {
      if (a.currentTime + gap + 2 > 19) { a.currentTime = 0.5; await until(a, 'seeked'); await wait(800); }
      frames = [];
      const t0 = performance.now();
      if (mode === 'nudge') b.currentTime += lead; // a small correction, relative to where it is
      else if (mode === 'seek') b.currentTime = a.currentTime + gap + lead;
      else { b.pause(); b.currentTime = a.currentTime + gap + lead; await until(b, 'seeked'); b.play(); }
      const offs = [];
      for (let w = 0; w < 10; w++) { await wait(200); offs.push(+(b.currentTime - a.currentTime - gap).toFixed(3)); }
      const off = offs.at(-1);
      if (window.verbose) console.log(mode, 'offset every 200 ms after the seek:', offs.join(' '));
      const worst = Math.max(...frames.slice(1).map((f, i) => f - frames[i]).filter((_, i) => frames[i] > t0));
      out.push({ off: +off.toFixed(3), worst: +worst.toFixed(0) });
    }
    a.pause(); b.pause();
    return out;
  };
  window.ready = true;
</script>
</body>
</html>
