<!doctype html>
<html>
<body style="margin:0;background:#000">
<div style="position:relative;width:640px;height:360px">
  <video id="a" src="/media/a.mp4" style="position:absolute;width:640px;height:360px" playsinline></video>
  <video id="b" src="/media/a.mp4" style="position:absolute;width:640px;height:360px;opacity:0" playsinline></video>
</div>
<script type="module">
  // A twin already playing silently: does making it heard (unmute, or volume 0 → 1) or trimming its rate hitch it?
  const [a, b] = ['a', 'b'].map((id) => document.getElementById(id));
  const until = (el, k) => new Promise((r) => el.addEventListener(k, r, { once: true }));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  window.probe = async ({ silent, trim, under, noSound, noReveal, pauseLater, reveal, silenceOld, seekLater, playLater }) => {
    for (const el of [a, b]) if (el.readyState < 2) await until(el, 'loadeddata');
    a.muted = false; a.volume = 1; a.currentTime = 1; await until(a, 'seeked'); await a.play();
    b.pause();
    // under: the twin stays painted, beneath the one you see (z-order), instead of opacity 0
    a.style.zIndex = '1'; b.style.zIndex = '0'; a.style.opacity = '1';
    b.style.opacity = under ? '1' : '0';
    if (silent === 'muted') { b.muted = true; b.volume = 1; } else { b.muted = false; b.volume = silent === 'tiny' ? 1e-4 : 0; }
    b.currentTime = 6; await until(b, 'seeked');
    await b.play();
    await wait(400);
    if (trim) { b.playbackRate = 1.05; await wait(200); b.playbackRate = 1; }
    await wait(300);
    const frames = [];
    const cb = (now, m) => { frames.push({ now, media: m.mediaTime }); b.requestVideoFrameCallback(cb); };
    b.requestVideoFrameCallback(cb);
    await wait(300);
    const t0 = performance.now(), m0 = b.currentTime;
    if (!noSound) { b.muted = false; b.volume = 1; }
    if (reveal === 'z') { a.style.zIndex = '0'; b.style.zIndex = '1'; }
    else if (reveal === 'topOut') a.style.opacity = '0';
    else if (!noReveal) { b.style.opacity = '1'; a.style.opacity = '0'; }
    if (silenceOld === 'keep') {} // the old one stays audible
    else if (silenceOld === 'muted') a.muted = true;
    else if (silenceOld === 'tiny') a.volume = 1e-4;
    else if (pauseLater == null) a.pause(); else a.volume = 0;
    if (pauseLater) { await wait(pauseLater); a.pause(); }
    if (seekLater) { await wait(seekLater); a.currentTime = 12; }
    if (playLater) { a.pause(); a.currentTime = 12; await until(a, 'seeked'); await wait(playLater); a.play(); }
    await wait(500);
    b.pause(); a.pause(); b.style.opacity = '0'; a.style.opacity = '1';
    const steps = frames.slice(1).map((f, i) => ({ at: f.now - t0, gap: f.now - frames[i].now, dm: f.media - frames[i].media }));
    const after = steps.filter((s) => s.at > -50);
    const worst = after.reduce((w, s) => (s.gap > w.gap ? s : w), after[0]);
    return { worstGap: worst.gap.toFixed(1), at: worst.at.toFixed(0), worstMediaStep: Math.max(...after.map((s) => s.dm)).toFixed(3), clockAtSwap: m0.toFixed(3) };
  };
  window.ready = true;
</script>
</body>
</html>
