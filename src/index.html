<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <title>SuperCut</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="h-full bg-bg font-sans text-[13px] text-text antialiased select-none">
    <main class="flex h-full flex-col gap-4 p-4">
      <p id="claude" class="text-text-secondary" role="status">Checking Claude Code…</p>
      <section
        id="drop"
        class="flex flex-1 flex-col items-center justify-center gap-2 rounded-2xl border-[1.5px] border-dashed border-hairline"
      >
        <h1 class="text-xl font-semibold">Drop a video to start</h1>
        <p id="status" class="text-text-secondary" role="status" aria-live="polite">It transcribes on this Mac.</p>
      </section>
      <p id="transcript" class="hidden max-h-60 overflow-auto text-[15px] leading-normal select-text"></p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
