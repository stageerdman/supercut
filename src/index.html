<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <title>Magic Cut</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="h-full overflow-hidden bg-bg font-sans text-[13px] text-text antialiased select-none">
    <div class="relative flex h-full flex-col">
      <!-- Toolbar -->
      <header class="flex h-[52px] shrink-0 items-center border-b border-hairline px-4">
        <h1 id="title" class="min-w-0 flex-1 truncate font-semibold"></h1>
        <!-- Status: what the app is doing, labeled, with its own bar. Gone when there's nothing to say (src/ui/status.js) -->
        <div id="work" class="mr-4 hidden min-w-0 shrink items-center gap-3">
          <span id="status" role="status" aria-live="polite" class="truncate tabular-nums text-text-secondary"></span>
          <div id="progress-track" role="progressbar" aria-label="Transcription progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
               class="hidden h-1 w-24 shrink-0 overflow-hidden rounded-full bg-raised">
            <div id="progress-bar" class="h-full rounded-full bg-accent transition-[width]" style="width: 0"></div>
          </div>
        </div>
        <!-- Your rules: the gear opens the rules panel below (src/ui/rules.js, design/rules.md) -->
        <button id="rules-gear" aria-label="Your rules" aria-expanded="false" aria-controls="rules-panel" title="Your editing rules (⌘,)"
                class="mr-2 flex size-8 shrink-0 items-center justify-center rounded-md text-text-secondary hover:text-text focus-visible:outline-2 focus-visible:outline-accent">
          <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <!-- The AI spot: the one primary action, far right (src/ui/magic.js, design/ai-slot.md) -->
        <button id="magic" class="hidden"></button>
      </header>

      <!-- Your rules: one per line, saved as you type; floats under the gear -->
      <section id="rules-panel" role="dialog" aria-labelledby="rules-title"
               class="absolute top-[56px] right-4 z-10 hidden w-[360px] space-y-3 rounded-[10px] border border-hairline bg-surface p-4">
        <div>
          <h2 id="rules-title" class="font-semibold">Your rules</h2>
          <p id="rules-hint" class="text-text-secondary">Magic Cut follows these the next time it runs. One rule per line, in plain words.</p>
        </div>
        <textarea id="rules-box" rows="8" spellcheck="true" aria-labelledby="rules-title" aria-describedby="rules-hint"
                  placeholder="Keep my jokes&#10;Cut every um and uh"
                  class="block w-full resize-none rounded-md border border-hairline bg-bg p-3 text-[15px] leading-normal text-text select-text placeholder:text-text-secondary focus-visible:outline-2 focus-visible:outline-accent"></textarea>
      </section>

      <!-- Banner: one sentence, at most one action, ✕ -->
      <div id="banner" role="alert" class="hidden h-11 shrink-0 items-center gap-3 border-b border-hairline bg-raised px-4">
        <p id="banner-text" class="flex-1 truncate"></p>
        <button id="banner-action" class="hidden rounded-md px-2 py-1 text-accent hover:bg-surface"></button>
        <button id="banner-close" aria-label="Dismiss" class="rounded-md px-2 py-1 text-text-secondary hover:bg-surface">✕</button>
      </div>

      <!-- Empty state: the whole window is the drop target -->
      <main id="empty" class="flex flex-1 items-center justify-center p-8">
        <section
          id="dropzone"
          aria-label="Drop a video, or choose one"
          class="flex h-[280px] w-[520px] max-w-full flex-col items-center justify-center gap-4 rounded-2xl border-[1.5px] border-dashed border-hairline transition-colors duration-[120ms]"
        >
          <h2 id="drop-headline" class="text-xl font-semibold">Drop a video here</h2>
          <button data-choose class="rounded-lg bg-accent px-4 py-2 font-semibold text-on-accent hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
            Choose Video…
          </button>
          <p class="text-text-secondary">MP4 · MOV · M4V — up to 2 parts</p>
        </section>
      </main>

      <!-- Editor -->
      <main id="editor" class="hidden min-h-0 flex-1 flex-col">
        <div class="flex min-h-0 flex-1">
          <div class="flex min-w-0 flex-1 items-center justify-center bg-black">
            <video id="player" tabindex="0" aria-label="Video player" class="max-h-full max-w-full outline-none"></video>
          </div>
          <aside id="transcript-panel" class="hidden w-[320px] shrink-0 flex-col border-l border-hairline bg-surface">
            <h2 class="px-4 pt-3 pb-2 text-text-secondary">Transcript</h2>
            <div id="transcript" class="flex-1 overflow-y-auto px-4 pb-4 text-[15px] leading-normal outline-none select-none focus-visible:ring-1 focus-visible:ring-inset focus-visible:ring-accent"></div>
          </aside>
        </div>

        <!-- Transport row: play, edited time; zoom far right (its only job) -->
        <div class="flex h-10 shrink-0 items-center gap-3 border-t border-hairline px-4">
          <button id="play" aria-label="Play" class="w-6 text-text hover:text-accent">▶</button>
          <span id="time" class="flex-1 tabular-nums text-text-secondary">00:00 / 00:00</span>
          <button id="zoom-out" aria-label="Zoom out" title="Zoom out (⌘−)" class="flex size-7 items-center justify-center rounded-md text-text-secondary hover:text-text">−</button>
          <input id="zoom" type="range" min="0" max="100" value="0" aria-label="Timeline zoom" class="w-24 accent-accent" />
          <button id="zoom-in" aria-label="Zoom in" title="Zoom in (⌘+)" class="flex size-7 items-center justify-center rounded-md text-text-secondary hover:text-text">+</button>
        </div>

        <!-- Timeline: ruler, one track per part (waveform, cuts), playhead, then the add-slot (src/ui/timeline.js) -->
        <div id="timeline" aria-label="Timeline" class="relative h-[128px] shrink-0 overflow-x-auto overflow-y-hidden border-t border-hairline"></div>
      </main>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
